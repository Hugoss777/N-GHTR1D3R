# HUNTER SCALPER 7.0 - настройки
# Положи этот файл рядом с hunter_scalper_7.py. Менять код не нужно.
# Приоритет: переменная окружения > этот файл > значение по умолчанию.
# Токен Telegram лучше не хранить в файле, если он попадёт в git: задай его через переменную окружения.

# ---------------- Telegram ----------------
TELEGRAM_TOKEN: ""
TELEGRAM_CHAT_ID: ""

# ---------------- Биржи и список монет ----------------
EXCHANGES: bingx,okx          # bingx, okx или обе через запятую
MAX_SYMBOLS: 30               # сколько самых ликвидных монет сканировать на каждой бирже
MIN_VOLUME: 3000000           # минимальный суточный объём, USDT
MAX_SPREAD_PCT: 0.10          # максимальный спред, %

# ---------------- Частота ----------------
SCAN_SECONDS: 30              # как часто просыпается цикл (скан идёт 1 раз на закрытую 5m-свечу)
COOLDOWN_MINUTES: 30          # пауза по монете после сигнала
MAX_OPEN_SIGNALS: 3           # максимум одновременно открытых сигналов (ожидание + в сделке)
MAX_SAME_SIDE: 2              # максимум сигналов в одну сторону одновременно (альты ходят вместе с BTC)
MAX_SIGNAL_AGE_SEC: 150       # не отправлять сигнал, если 5m-свеча закрылась давно

# ---------------- Стратегии и фильтры сигнала ----------------
STRATEGIES: pullback,sweep    # pullback = тренд + откат, sweep = снятие уровня и возврат
MIN_SCORE: 65                 # минимальная оценка сигнала (0-100). Мало сигналов - снижай
ADX_MIN: 20                   # сила тренда на 15m для стратегии pullback
VOL_MIN_RATIO: 1.1            # объём подтверждающей свечи к среднему
MIN_ATR_PCT: 0.10             # минимальная волатильность 5m (ATR), %
MAX_ATR_PCT: 1.2              # максимальная волатильность 5m (ATR), %
TRADE_HOURS: ""               # часы работы по TIMEZONE, например 9-23. Пусто = круглосуточно

# ---------------- Сделка: вход, TP, стоп ----------------
ENTRY_TTL_MIN: 15             # сколько минут сигнал ждёт входа в зону
TRADE_TTL_MIN: 120            # максимум удержания после входа, минут
MAX_STOP_PCT: 1.0             # максимальный стоп от входа, %
MIN_RR: 1.0                   # минимальное R до TP (иначе нет места до уровня - сигнала нет)
MAX_RR: 1.5                   # TP не дальше этого R

# ---------------- Комиссии ----------------
TAKER_FEE_PCT: 0.05           # taker-комиссия одной стороны, %
FEE_MULT: 4                   # TP должен быть не меньше FEE_MULT * комиссия
MAX_FEE_R: 0.25               # комиссии не больше этой доли риска (в R). Чем меньше, тем шире стоп должен быть

# ---------------- Автостоп (защита от серии убытков) ----------------
# Считается по net R (после комиссий), только по сделкам, где вход реально случился.
GUARD_ENABLED: true           # false = выключить автостоп (не рекомендуется)
MAX_CONSEC_LOSSES: 3          # столько убыточных сделок подряд -> пауза новых сигналов
PAUSE_MINUTES: 180            # базовая пауза. Повторное срабатывание за сутки: x2, x4 ... максимум 24 ч
MAX_DAILY_LOSS_R: 4.0         # убыток за день в R -> пауза до полуночи
MAX_DAILY_STOPS: 3            # стопов за день -> пауза до полуночи (по TIMEZONE)         # убыток за день в R -> пауза до полуночи (по TIMEZONE)
ROLL_N: 20                    # скользящая проверка: последние N сделок
ROLL_MIN_AVG_R: -0.15         # если средний net R последних N сделок ниже - пауза
STRAT_ROLL_N: 10              # проверка каждой стратегии отдельно: последние N её сделок
STRAT_MIN_AVG_R: -0.30        # средний net R ниже - стратегия отключается
STRAT_PAUSE_HOURS: 24
SYMBOL_MAX_LOSSES: 2          # столько убытков подряд по одной монете -> монета исключается
SYMBOL_PAUSE_HOURS: 12

# ---------------- Файлы и прочее ----------------
TIMEZONE: Europe/Istanbul     # время в сообщениях и часы TRADE_HOURS
STATE_FILE: hunter_scalper7_state.json
JOURNAL_FILE: hunter_scalper_journal.csv
LOG_FILE: hunter_scalper.log
LOG_LEVEL: INFO
RUN_ONCE: false               # true = один цикл и выход (для проверки запуска)

# ---------------- Стопы и цель: структура рынка ----------------
STOP_BUFFER_ATR: 0.1          # запас за ближайшим хаем (шорт) / лоем (лонг), в ATR
TP_BUFFER_ATR: 0.05           # TP чуть не доходит до первого хая/лоя, в ATR
STRUCT_LOOKBACK: 40           # окно (5m-свечей) для поиска стопа
TP_LOOKBACK: 60               # окно (5m-свечей) для поиска первого уровня под TP
FRACTAL_K: 2                  # свечей с каждой стороны, чтобы хай/лой считался подтверждённым
